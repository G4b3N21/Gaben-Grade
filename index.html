<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Gaben Grade" />

  <link rel="apple-touch-icon" href="./ikon.jpg" />
  <link rel="icon" type="image/jpeg" href="./ikon.jpg" />
  <title>Gaben Grade</title>

  <script>
    async function enablePersistentStorage() {
      if (navigator.storage && navigator.storage.persist) {
        await navigator.storage.persist();
      }
    }
    enablePersistentStorage();

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>

  <style>
    :root {
      --bg: #0F172A;
      --card: #1E293B;
      --border: #334155;
      --text: #F1F5F9;
      --muted: #94A3B8;
      --accent: #F43F5E;
      --g1: #10B981;
      --g2: #38BDF8;
      --g3: #F59E0B;
      --g4: #F97316;
      --g5: #EF4444;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom) 16px;
      min-height: 100vh;
    }

    .container { max-width: 600px; margin: 0 auto; padding: 16px 0 90px 0; }

    /* Header */
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 8px; flex-wrap: wrap; }
    .top-bar h2 { margin: 0; font-size: 22px; letter-spacing: 0.3px; }
    .coral-accent { color: var(--accent); text-shadow: 0 0 12px rgba(244, 63, 94, 0.4); }
    .top-actions { display: flex; gap: 6px; }

    /* Term Switcher & Overall Stats */
    .term-bar { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
    .term-btn {
      background: var(--card); border: 1px solid var(--border); color: var(--muted);
      padding: 9px; border-radius: 10px; font-size: 13px; font-weight: 700; cursor: pointer;
    }
    .term-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(244, 63, 94, 0.1); }

    .summary-bar {
      display: flex; justify-content: space-between; align-items: center;
      background: var(--card); border: 1px solid var(--border);
      padding: 10px 14px; border-radius: 10px; margin-bottom: 12px; font-size: 13px; color: var(--muted);
    }
    .summary-bar b { color: var(--text); font-size: 15px; }

    /* Inputs & Buttons */
    input {
      width: 100%; background: var(--card); border: 1px solid var(--border); color: var(--text);
      padding: 11px 13px; border-radius: 10px; font-size: 15px; margin-bottom: 12px; outline: none;
    }
    input:focus { border-color: var(--accent); }

    button {
      background: var(--card); border: 1px solid var(--border); color: var(--text);
      padding: 7px 11px; border-radius: 9px; font-size: 12px; font-weight: 600; cursor: pointer;
    }
    button:active { opacity: 0.7; }
    .btn-accent { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
    .btn-danger { color: #EF4444; border-color: rgba(239, 68, 68, 0.4); }

    /* Subject Cards */
    .subject-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-left: 4px solid var(--accent);
      border-radius: 12px;
      padding: 13px 14px;
      margin-bottom: 11px;
    }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; gap: 8px; }
    .subject-name { font-size: 17px; font-weight: 700; }
    .avg-badge {
      font-family: ui-monospace, monospace; font-size: 13px; font-weight: 800;
      padding: 3px 9px; border-radius: 8px; background: var(--bg); border: 1px solid var(--border);
    }

    /* Grade Chips */
    .grades-list { display: flex; flex-wrap: wrap; gap: 6px; min-height: 32px; align-items: center; margin-bottom: 10px; }
    .grade-chip {
      width: 30px; height: 30px; border-radius: 8px; display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 14px; cursor: pointer; background: var(--bg); border: 1px solid var(--border);
    }
    .g-1 { color: var(--g1); border-color: rgba(16, 185, 129, 0.45); }
    .g-2 { color: var(--g2); border-color: rgba(56, 189, 248, 0.45); }
    .g-3 { color: var(--g3); border-color: rgba(245, 158, 11, 0.45); }
    .g-4 { color: var(--g4); border-color: rgba(249, 115, 22, 0.45); }
    .g-5 { color: var(--g5); border-color: rgba(239, 68, 68, 0.45); }

    /* Quick Add Grade Buttons */
    .quick-add-row { display: flex; gap: 6px; align-items: center; margin-bottom: 10px; }
    .quick-label { font-size: 11px; color: var(--muted); margin-right: 2px; }
    .add-g-btn {
      flex: 1; padding: 6px 0; text-align: center; font-weight: 800; font-size: 13px;
      background: var(--bg); border-radius: 8px;
    }

    .card-actions {
      display: flex; justify-content: space-between; align-items: center;
      padding-top: 8px; border-top: 1px solid rgba(51, 65, 85, 0.6);
    }

    /* Floating Add Button */
    .fab {
      position: fixed; bottom: calc(20px + env(safe-area-inset-bottom)); right: 20px;
      background: var(--accent); color: #fff; border: none; border-radius: 50px;
      padding: 14px 22px; font-size: 16px; font-weight: 800; box-shadow: 0 6px 20px rgba(0,0,0,0.45);
    }

    /* Modal */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(15, 23, 42, 0.88);
      display: none; align-items: center; justify-content: center; padding: 16px; z-index: 50;
    }
    .modal {
      background: var(--card); border: 1px solid var(--border); border-radius: 16px;
      width: 100%; max-width: 420px; padding: 20px;
    }
    .modal h3 { margin: 0 0 14px 0; color: var(--accent); }
    .modal input[type="text"] { background: var(--bg); }
    .field-label { font-size: 11px; color: var(--muted); display: block; margin-bottom: 4px; }
    .modal-actions { display: flex; gap: 10px; margin-top: 14px; }
    .modal-actions button { flex: 1; padding: 11px; }
  </style>
</head>
<body>

<div class="container">
  <div class="top-bar">
    <h2><span class="coral-accent">Gaben</span> Grade</h2>
    <div class="top-actions">
      <button onclick="exportData()">Export</button>
      <button onclick="document.getElementById('importFile').click()">Import</button>
      <input type="file" id="importFile" accept=".json" onchange="importData(event)" style="display:none;" />
    </div>
  </div>

  <div class="term-bar">
    <button class="term-btn active" id="term1Btn" onclick="setTerm(1)">1st Term (Félév)</button>
    <button class="term-btn" id="term2Btn" onclick="setTerm(2)">2nd Term (Félév)</button>
  </div>

  <div class="summary-bar">
    <span>Overall Average: <b id="overallAvg">-</b></span>
    <span>Total Grades: <b id="totalGradesCount">0</b></span>
  </div>

  <input type="text" id="searchInput" placeholder="Search subject..." oninput="renderSubjects()" />

  <div id="subjectsList"></div>
</div>

<button class="fab" onclick="openSubjectModal()">+ Add Subject</button>

<!-- ADD / EDIT SUBJECT MODAL -->
<div id="subjectModalBackdrop" class="modal-backdrop">
  <div class="modal">
    <h3 id="subjectModalTitle">Add Subject</h3>
    <input type="hidden" id="editSubjectId" />

    <label class="field-label">Subject Name *</label>
    <input type="text" id="subjectNameInput" placeholder="e.g. Mathematics, English, Biology..." />

    <label class="field-label">Subject Accent Color</label>
    <div style="display:flex; align-items:center; gap:10px;">
      <input type="color" id="subjectColorInput" value="#38BDF8" style="width:54px; height:42px; padding:2px; margin:0; cursor:pointer;" />
      <span style="font-size:13px; color:var(--muted);">Pick a color strip for this subject</span>
    </div>

    <div class="modal-actions">
      <button onclick="closeSubjectModal()">Cancel</button>
      <button class="btn-accent" onclick="saveSubject()">Save</button>
    </div>
  </div>
</div>
<script>
  const SUBJECTS_KEY = 'gaben_grade_subjects_v1';
  let subjects = JSON.parse(localStorage.getItem(SUBJECTS_KEY) || '[]');
  let currentTerm = 1;

  window.addEventListener('DOMContentLoaded', () => {
    renderSubjects();
  });

  function saveAll() {
    localStorage.setItem(SUBJECTS_KEY, JSON.stringify(subjects));
  }

  function setTerm(term) {
    currentTerm = term;
    document.getElementById('term1Btn').classList.toggle('active', term === 1);
    document.getElementById('term2Btn').classList.toggle('active', term === 2);
    renderSubjects();
  }

  function getTermGrades(subject) {
    if (!subject.grades) subject.grades = { 1: [], 2: [] };
    if (!Array.isArray(subject.grades[currentTerm])) subject.grades[currentTerm] = [];
    return subject.grades[currentTerm];
  }

  function addGrade(subjectId, gradeVal) {
    const subj = subjects.find(s => s.id === subjectId);
    if (!subj) return;
    getTermGrades(subj).push(gradeVal);
    saveAll();
    renderSubjects();
  }

  function removeGrade(subjectId, gradeIdx) {
    const subj = subjects.find(s => s.id === subjectId);
    if (!subj) return;
    const grades = getTermGrades(subj);
    const val = grades[gradeIdx];
    if (!confirm(`Remove grade "${val}" from ${subj.name}?`)) return;
    grades.splice(gradeIdx, 1);
    saveAll();
    renderSubjects();
  }

  function moveSubject(id, direction) {
    const idx = subjects.findIndex(s => s.id === id);
    if (idx === -1) return;
    const targetIdx = idx + direction;
    if (targetIdx < 0 || targetIdx >= subjects.length) return;
    const temp = subjects[idx];
    subjects[idx] = subjects[targetIdx];
    subjects[targetIdx] = temp;
    saveAll();
    renderSubjects();
  }

  function renderSubjects() {
    const listEl = document.getElementById('subjectsList');
    const query = document.getElementById('searchInput').value.trim().toLowerCase();

    // Calculate overall stats for current term
    let allGradesSum = 0;
    let allGradesCount = 0;
    subjects.forEach(s => {
      const gList = getTermGrades(s);
      gList.forEach(g => {
        allGradesSum += g;
        allGradesCount++;
      });
    });

    document.getElementById('totalGradesCount').textContent = allGradesCount;
    document.getElementById('overallAvg').textContent = allGradesCount > 0
      ? (allGradesSum / allGradesCount).toFixed(2)
      : '-';

    const filtered = subjects.filter(s => s.name.toLowerCase().includes(query));

    if (filtered.length === 0) {
      listEl.innerHTML = `<p style="text-align:center; color: var(--muted); margin-top: 40px;">No subjects yet. Tap "+ Add Subject" to start!</p>`;
      return;
    }

    listEl.innerHTML = filtered.map(s => {
      const grades = getTermGrades(s);
      const avg = grades.length > 0
        ? (grades.reduce((a, b) => a + b, 0) / grades.length).toFixed(2)
        : '-';
      const color = s.color || '#F43F5E';

      const chipsHtml = grades.length > 0
        ? grades.map((g, idx) => `<div class="grade-chip g-${g}" title="Tap to remove" onclick="removeGrade('${s.id}', ${idx})">${g}</div>`).join('')
        : `<span style="font-size:12px; color:var(--muted);">No grades recorded yet</span>`;

      return `
        <div class="subject-card" style="border-left-color: ${color};">
          <div class="card-header">
            <span class="subject-name" style="color: ${color};">${escapeHtml(s.name)}</span>
            <span class="avg-badge">Avg: ${avg}</span>
          </div>

          <div class="grades-list">${chipsHtml}</div>

          <div class="quick-add-row">
            <span class="quick-label">+ Grade:</span>
            <button class="add-g-btn g-1" onclick="addGrade('${s.id}', 1)">1</button>
            <button class="add-g-btn g-2" onclick="addGrade('${s.id}', 2)">2</button>
            <button class="add-g-btn g-3" onclick="addGrade('${s.id}', 3)">3</button>
            <button class="add-g-btn g-4" onclick="addGrade('${s.id}', 4)">4</button>
            <button class="add-g-btn g-5" onclick="addGrade('${s.id}', 5)">5</button>
          </div>

          <div class="card-actions">
            <div style="display:flex; gap:5px;">
              <button onclick="moveSubject('${s.id}', -1)">↑</button>
              <button onclick="moveSubject('${s.id}', 1)">↓</button>
            </div>
            <div style="display:flex; gap:5px;">
              <button onclick="openSubjectModal('${s.id}')">Edit</button>
              <button class="btn-danger" onclick="deleteSubject('${s.id}')">Delete</button>
            </div>
          </div>
        </div>
      `;
    }).join('');
  }
  function openSubjectModal(id = null) {
    document.getElementById('editSubjectId').value = id || '';
    document.getElementById('subjectModalTitle').textContent = id ? 'Edit Subject' : 'Add Subject';

    if (id) {
      const subj = subjects.find(s => s.id === id);
      document.getElementById('subjectNameInput').value = subj.name;
      document.getElementById('subjectColorInput').value = subj.color || '#38BDF8';
    } else {
      document.getElementById('subjectNameInput').value = '';
      document.getElementById('subjectColorInput').value = '#38BDF8';
    }
    document.getElementById('subjectModalBackdrop').style.display = 'flex';
  }

  function closeSubjectModal() {
    document.getElementById('subjectModalBackdrop').style.display = 'none';
  }

  function saveSubject() {
    const name = document.getElementById('subjectNameInput').value.trim();
    if (!name) return alert('Please enter a subject name.');

    const id = document.getElementById('editSubjectId').value;
    const color = document.getElementById('subjectColorInput').value;

    if (id) {
      const subj = subjects.find(s => s.id === id);
      if (subj) {
        subj.name = name;
        subj.color = color;
      }
    } else {
      subjects.push({
        id: Date.now().toString(),
        name,
        color,
        grades: { 1: [], 2: [] }
      });
    }

    saveAll();
    closeSubjectModal();
    renderSubjects();
  }

  function deleteSubject(id) {
    const subj = subjects.find(s => s.id === id);
    if (!subj) return;
    if (!confirm(`Delete "${subj.name}" and all its grades?`)) return;
    subjects = subjects.filter(s => s.id !== id);
    saveAll();
    renderSubjects();
  }

  // Export & Import
  function exportData() {
    const payload = JSON.stringify({ subjects }, null, 2);
    const blob = new Blob([payload], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `gaben-grade-backup-${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
  }

  function importData(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const parsed = JSON.parse(e.target.result);
        if (Array.isArray(parsed.subjects)) {
          subjects = parsed.subjects;
          saveAll();
          renderSubjects();
          alert('Grades backup imported successfully!');
        }
      } catch (err) {
        alert('Invalid backup file.');
      }
      event.target.value = '';
    };
    reader.readAsText(file);
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
  }
</script>
</body>
</html>
